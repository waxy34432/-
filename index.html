<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>waxy09</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #04060a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* --- ЭФФЕКТ ЛАВА-ЛАМПЫ НА СHИСТОМ CSS --- */
        .lava-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            filter: blur(80px);
            opacity: 0.65;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: moveBlob 22s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -20%;
            left: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.45) 0%, transparent 70%);
            animation-duration: 28s;
        }

        .blob-2 {
            bottom: -20%;
            right: -10%;
            width: 65vw;
            height: 65vw;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.4) 0%, transparent 70%);
            animation-duration: 22s;
        }

        .blob-3 {
            top: 30%;
            left: 40%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.35) 0%, transparent 70%);
            animation-duration: 32s;
        }

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(15%, 10%) scale(1.1); }
            100% { transform: translate(-10%, -15%) scale(0.9); }
        }

        /* --- АНИМАЦИЯ ПУЗЫРЬКОВ НА CSS --- */
        .bubbles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.12), rgba(99, 102, 241, 0.03));
            border-radius: 50%;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.08), 0 0 15px rgba(139, 92, 246, 0.08);
            animation: floatUp 14s infinite linear;
        }

        /* Индивидуальные настройки для каждого пузырька (разные размеры и задержки) */
        .b1 { left: 10%; width: 30px; height: 30px; animation-duration: 12s; animation-delay: 0s; }
        .b2 { left: 25%; width: 15px; height: 15px; animation-duration: 16s; animation-delay: 2s; }
        .b3 { left: 40%; width: 22px; height: 22px; animation-duration: 14s; animation-delay: 5s; }
        .b4 { left: 55%; width: 12px; height: 12px; animation-duration: 18s; animation-delay: 1s; }
        .b5 { left: 70%; width: 28px; height: 28px; animation-duration: 13s; animation-delay: 7s; }
        .b6 { left: 85%; width: 18px; height: 18px; animation-duration: 15s; animation-delay: 3s; }

        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            15% { opacity: 0.5; }
            85% { opacity: 0.5; }
            100% { transform: translateY(-115vh) translateX(40px); opacity: 0; }
        }

        /* --- ГЛАВНАЯ КАРТОЧКА --- */
        .card {
            background: rgba(10, 12, 22, 0.45);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 45px 35px;
            border-radius: 28px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7);
            position: relative;
            z-index: 10;
        }

        .avatar {
            width: 95px;
            height: 95px;
            background: linear-gradient(45deg, #111424, #1f233b);
            border-radius: 50%;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            border: 2px solid rgba(139, 92, 246, 0.2);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.15);
        }

        h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #4f5e75;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            margin-bottom: 35px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 16px;
            border-radius: 15px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease, fill 0.3s ease;
        }

        /* Кнопка 1: ТГ Канал */
        .btn-tg-channel {
            background: rgba(34, 158, 217, 0.06);
            border-color: rgba(34, 158, 217, 0.15);
            color: #38bdf8;
        }
        .btn-tg-channel svg { fill: #38bdf8; }
        .btn-tg-channel:hover {
            background: #229ed9;
            color: #fff;
            box-shadow: 0 0 25px rgba(34, 158, 217, 0.45);
            transform: translateY(-3px);
        }
        .btn-tg-channel:hover svg { fill: #fff; }

        /* Кнопка 2: Личный ТГ */
        .btn-tg-private {
            background: rgba(99, 102, 241, 0.06);
            border-color: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }
        .btn-tg-private svg { fill: #818cf8; }
        .btn-tg-private:hover {
            background: #4f46e5;
            color: #fff;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.45);
            transform: translateY(-3px);
        }
        .btn-tg-private:hover svg { fill: #fff; }

        /* Кнопка 3: TikTok */
        .btn-tiktok {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .btn-tiktok svg { fill: #fff; }
        .btn-tiktok:hover {
            background: #0f1015;
            border-color: #fe2c55;
            box-shadow: -4px -4px 12px rgba(37, 244, 238, 0.25), 4px 4px 12px rgba(254, 44, 85, 0.25);
            transform: translateY(-3px);
        }

        /* Кнопка 4: Discord */
        .btn-discord {
            background: rgba(88, 101, 242, 0.06);
            border-color: rgba(88, 101, 242, 0.15);
            color: #6366f1;
        }
        .btn-discord svg { fill: #6366f1; }
        .btn-discord:hover {
            background: #5865f2;
            color: #fff;
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.45);
            transform: translateY(-3px);
        }
        .btn-discord:hover svg { fill: #fff; }
    </style>
</head>
