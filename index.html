    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #090d16 0%, #111827 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 40px 30px;
            border-radius: 24px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: linear-gradient(45deg, #1e293b, #334155);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Общие стили для всех кнопок */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 16px;
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            cursor: pointer;
        }

        /* Стилизация SVG иконок */
        .btn svg {
            width: 22px;
            height: 22px;
            transition: transform 0.3s ease, fill 0.3s ease;
        }

        /* Кнопка 1: ТГ Канал */
        .btn-tg-channel {
            background: rgba(34, 158, 217, 0.1);
            border-color: rgba(34, 158, 217, 0.3);
            color: #229ed9;
        }
        .btn-tg-channel svg {
            fill: #229ed9;
        }
        .btn-tg-channel:hover {
            background: #229ed9;
            color: #fff;
            box-shadow: 0 0 20px rgba(34, 158, 217, 0.5);
            transform: translateY(-2px);
        }
        .btn-tg-channel:hover svg {
            fill: #fff;
        }

        /* Кнопка 2: Личный ТГ */
        .btn-tg-private {
            background: rgba(0, 136, 204, 0.1);
            border-color: rgba(0, 136, 204, 0.3);
            color: #0088cc;
        }
        .btn-tg-private svg {
            fill: #0088cc;
        }
        .btn-tg-private:hover {
            background: #0088cc;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.5);
            transform: translateY(-2px);
        }
        .btn-tg-private:hover svg {
            fill: #fff;
        }

        /* Кнопка 3: TikTok */
        .btn-tiktok {
            background: rgba(255, 255, 255, 0.03);
            border-color: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .btn-tiktok svg {
            fill: #fff;
        }
        .btn-tiktok:hover {
            background: #010101;
            border-color: #fe2c55;
            box-shadow: -3px -3px 10px rgba(37, 244, 238, 0.3), 3px 3px 10px rgba(254, 44, 85, 0.3);
            transform: translateY(-2px);
        }

        /* Кнопка 4: Discord */
        .btn-discord {
            background: rgba(88, 101, 242, 0.1);
            border-color: rgba(88, 101, 242, 0.3);
            color: #5865f2;
        }
        .btn-discord svg {
            fill: #5865f2;
        }
        .btn-discord:hover {
            background: #5865f2;
            color: #fff;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.5);
            transform: translateY(-2px);
        }
        .btn-discord:hover svg {
            fill: #fff;
        }
    </style>
</head>
