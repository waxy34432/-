<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТЕСТОВЫЙ САЙТ ГИТ ХАБ </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #818cf8;
            box-shadow: 0 20px 40px rgba(129, 140, 248, 0.15);
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            padding: 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn:hover {
            background: #6366f1;
            border-color: #818cf8;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
            transform: scale(1.02);
        }

        .btn-alt {
            background: transparent;
            border: 1px solid rgba(168, 85, 247, 0.4);
        }

        .btn-alt:hover {
            background: #a855f7;
            border-color: #c084fc;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">🚀</div>
        <h1>тест!</h1>
        <p>тест</p>
        
        <div class="links-container">
            <a href="https://t.me/waxy00" target="_blank" class="btn">Мой Telegram</a>
            <a href="#" class="btn btn-alt">Посмотреть проекты</a>
        </div>
    </div>

</body>
</html>
